<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BasinWx</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/public/images/favicons/favicon.svg" type="image/svg+xml">

    <!-- Font Awesome -->

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<body data-page-type="live_aq">
<!-- Map Container -->
<div id="map"></div>

<!-- Map Controls (stacked below zoom buttons) -->
<div class="map-controls-stack">
    <div class="unit-toggle-control">
        <span>°C</span>
        <button type="button" role="switch" aria-checked="false" class="unit-toggle-switch active" id="unit-toggle" title="Toggle °C / °F" aria-label="Toggle temperature units">
            <span class="unit-switch-slider"></span>
        </button>
        <span>°F</span>
    </div>

    <div class="autocycle-toggle-control">
        <span class="autocycle-label">Auto-cycle</span>
        <button type="button" role="switch" aria-checked="false" class="kiosk-switch-map" id="map-kiosk-toggle" title="Auto-cycle stations" aria-label="Toggle station auto-cycle">
            <span class="switch-slider-map">
                <span class="timer-fill" id="timer-fill"></span>
            </span>
        </button>
    </div>
</div>

<!-- USU Logo -->
<div class="usu-logo">
    <img src="/public/images/images-removebg-preview.png" alt="Logo">
</div>

<!-- Study Area Overlay -->
<div class="overlay-container">
    <img src="/public/images/utah.png" id="image-overlay" alt="Study Area">
</div>

<!-- Warning Levels Overlay -->
<div class="warning-levels-overlay">
    <img src="/public/images/ozone-graphOZONE2.png" id="image-overlay1" alt="Warning Levels">
</div>

<!-- Sidebar Container -->
<div class="sidebar_container">
    <!-- Sidebar will be loaded here via loadSidebar.js -->
</div>

<!-- Footer -->
<footer class="main-footer">
    <div class="footer-content">
        <p>&copy; <span id="current-year">2026</span> Bingham Research Center. Experimental use only. All rights reserved.</p>
    </div>
</footer>

<!-- Scripts -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/public/js/loadSidebar.js"></script>
<script src="/public/js/loadFooter.js"></script>
<script type="module" src="/public/js/map.js"></script>
